<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#24302B" />
    <title>EverittOS</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f6f3;
        --text: #24302b;
        --muted: #5f6f66;
        --accent: #2f5f8f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top));
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(420px, 100%);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.35rem;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>EverittOS is offline</h1>
      <p>A connection to EverittOS is required to load your workspace. Check your network and try again.</p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script>
      const productionUrl = 'https://app.everittventures.com';
      document.getElementById('retry')?.addEventListener('click', () => {
        window.location.replace(productionUrl);
      });
    </script>
  </body>
</html>
