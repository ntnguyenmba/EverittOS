name: Apply recurring start date fix

on:
  push:
    paths:
      - .github/workflows/patch-recurring-job-creator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch recurring job creator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/job-creator.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
          """    const scheduledVisits = validVisits(visits);
              for (const visit of scheduledVisits) {
                if (!visit.visit_date || !visit.start_time || !visit.end_time) {
                  appFeedback.error('Each visit needs a date, start time, and end time.');
                  return;
                }
                if (visit.end_time <= visit.start_time) {
                  appFeedback.error('Visit end time must be after start time.');
                  return;
                }
              }
          """,
          """    const scheduledVisits = validVisits(visits);
              const firstVisit = scheduledVisits[0];

              if (recurrenceFrequency !== 'none') {
                if (!firstVisit?.visit_date) {
                  appFeedback.error('Choose when this recurring series starts.');
                  return;
                }
                if (!firstVisit.start_time || !firstVisit.end_time) {
                  appFeedback.error('Add the recurring start and end time.');
                  return;
                }
                if (firstVisit.end_time <= firstVisit.start_time) {
                  appFeedback.error('Recurring end time must be after start time.');
                  return;
                }
                if (recurrenceEndDate && recurrenceEndDate < firstVisit.visit_date) {
                  appFeedback.error('The recurring end date cannot be before the start date.');
                  return;
                }
              } else {
                for (const visit of scheduledVisits) {
                  if (!visit.visit_date || !visit.start_time || !visit.end_time) {
                    appFeedback.error('Each visit needs a date, start time, and end time.');
                    return;
                  }
                  if (visit.end_time <= visit.start_time) {
                    appFeedback.error('Visit end time must be after start time.');
                    return;
                  }
                }
              }
          """)

          replace_once(
          """    const firstVisit = scheduledVisits[0];
              const lastVisit = scheduledVisits[scheduledVisits.length - 1];
          """,
          """    const lastVisit = scheduledVisits[scheduledVisits.length - 1];
          """)

          replace_once(
          """      const startDate = firstVisit?.visit_date || new Date().toISOString().slice(0, 10);
          """,
          """      const startDate = firstVisit!.visit_date;
          """)

          replace_once(
          """    startDate: primaryVisit?.visit_date || new Date().toISOString().slice(0, 10),
          """,
          """    startDate: primaryVisit?.visit_date || '',
          """)

          replace_once(
          """                    type=\"date\"
                        value={primaryVisit.visit_date}
          """,
          """                    type=\"date\"
                        required
                        value={primaryVisit.visit_date}
          """)

          replace_once(
          """                <p className=\"muted\">Leave blank for no end date. Only the next {RECURRING_GENERATION_WINDOW_DAYS} days are scheduled at one time.</p>
          """,
          """                <p className=\"muted\">End date is optional. Leave it blank to continue until you end the series. EverittOS keeps the next {RECURRING_GENERATION_WINDOW_DAYS} days scheduled ahead.</p>
          """)

          replace_once(
          """              <p className=\"muted\" style={{ marginTop: 8 }}>{recurrenceSummary}</p>
          """,
          """              <p className=\"muted\" style={{ marginTop: 8 }}>
                    {primaryVisit?.visit_date ? recurrenceSummary : 'Choose a start date for this recurring series.'}
                  </p>
          """)

          replace_once(
          """          <p className=\"muted\" style={{ marginTop: 6 }}>{recurrenceSummary}</p>
          """,
          """          <p className=\"muted\" style={{ marginTop: 6 }}>
                {recurrenceFrequency === 'none' || primaryVisit?.visit_date
                  ? recurrenceSummary
                  : 'Choose a start date for this recurring series.'}
              </p>
          """)

          replace_once(
          """              Only the next {RECURRING_GENERATION_WINDOW_DAYS} days of visits are scheduled now. Financial defaults apply to each generated visit.
          """,
          """              The series continues until its optional end date or until you end it. EverittOS keeps the next {RECURRING_GENERATION_WINDOW_DAYS} days scheduled ahead. Financial defaults apply to each generated visit.
          """)

          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate
        run: |
          npm ci
          npm run typecheck

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "EverittOS Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-recurring-job-creator.yml
          git add components/job-creator.tsx
          git commit -m "Fix recurring series start date"
          git push
