name: Add safe recurring duplicate cleanup

on:
  push:
    paths:
      - .github/workflows/add-job-duplicate-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Add duplicate cleanup API and Jobs action
        shell: bash
        run: |
          mkdir -p app/api/jobs/deduplicate
          cat > app/api/jobs/deduplicate/route.ts <<'TS'
          import { NextResponse } from 'next/server';
          import { logWorkspaceActivity } from '@/lib/activity-server';
          import { mapWorkspaceSaveError } from '@/lib/workspace-server';
          import { requireWorkspaceSession } from '@/lib/workspace-api-auth';

          export const runtime = 'nodejs';
          export const dynamic = 'force-dynamic';

          type JobRow = {
            id: string;
            title: string | null;
            customer_id: string | null;
            customer_name: string | null;
            address: string | null;
            status: string | null;
            scheduled_start: string | null;
            scheduled_end: string | null;
            start_date: string | null;
            due_date: string | null;
            revenue_amount: number | null;
            recurring_series_id: string | null;
            occurrence_date: string | null;
            occurrence_local_time: string | null;
            created_at: string | null;
          };

          type DuplicatePreview = {
            duplicateCount: number;
            duplicateGroups: number;
            seriesToEnd: string[];
            extraJobIds: string[];
            examples: Array<{ date: string; title: string; address: string; copies: number }>;
          };

          const finishedStatuses = new Set(['completed', 'done', 'complete', 'closed', 'cancelled', 'canceled']);

          function normalize(value: unknown) {
            return String(value ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
          }

          function jobDate(job: JobRow) {
            return job.occurrence_date || job.start_date || job.due_date || job.scheduled_start?.slice(0, 10) || '';
          }

          function startTime(job: JobRow) {
            return job.occurrence_local_time || job.scheduled_start?.slice(11, 16) || '';
          }

          function endTime(job: JobRow) {
            return job.scheduled_end?.slice(11, 16) || '';
          }

          function fingerprint(job: JobRow) {
            const customer = job.customer_id ? `id:${job.customer_id}` : `name:${normalize(job.customer_name)}`;
            const amount = job.revenue_amount == null ? '' : Number(job.revenue_amount).toFixed(2);
            return [
              customer,
              normalize(job.address),
              normalize(job.title),
              jobDate(job),
              startTime(job),
              endTime(job),
              amount
            ].join('|');
          }

          function buildPreview(rows: JobRow[]): DuplicatePreview {
            const today = new Date().toISOString().slice(0, 10);
            const candidates = rows.filter((job) => {
              const date = jobDate(job);
              return Boolean(
                job.recurring_series_id &&
                  date &&
                  date >= today &&
                  !finishedStatuses.has(normalize(job.status))
              );
            });

            const seriesEarliest = new Map<string, string>();
            for (const job of candidates) {
              const seriesId = job.recurring_series_id!;
              const created = job.created_at || '9999-12-31T23:59:59.999Z';
              const current = seriesEarliest.get(seriesId);
              if (!current || created < current) seriesEarliest.set(seriesId, created);
            }

            const groups = new Map<string, JobRow[]>();
            for (const job of candidates) {
              const key = fingerprint(job);
              const group = groups.get(key) || [];
              group.push(job);
              groups.set(key, group);
            }

            const extraJobIds = new Set<string>();
            const seriesToEnd = new Set<string>();
            const examples: DuplicatePreview['examples'] = [];
            let duplicateGroups = 0;

            for (const group of groups.values()) {
              if (group.length < 2) continue;
              duplicateGroups += 1;
              const sorted = [...group].sort((a, b) => {
                const aSeries = seriesEarliest.get(a.recurring_series_id || '') || '9999';
                const bSeries = seriesEarliest.get(b.recurring_series_id || '') || '9999';
                if (aSeries !== bSeries) return aSeries.localeCompare(bSeries);
                const byCreated = String(a.created_at || '').localeCompare(String(b.created_at || ''));
                if (byCreated !== 0) return byCreated;
                return a.id.localeCompare(b.id);
              });
              const keeper = sorted[0];
              for (const duplicate of sorted.slice(1)) {
                extraJobIds.add(duplicate.id);
                if (
                  duplicate.recurring_series_id &&
                  keeper.recurring_series_id &&
                  duplicate.recurring_series_id !== keeper.recurring_series_id
                ) {
                  seriesToEnd.add(duplicate.recurring_series_id);
                }
              }
              if (examples.length < 12) {
                examples.push({
                  date: jobDate(keeper),
                  title: keeper.title || 'Untitled job',
                  address: keeper.address || '',
                  copies: group.length
                });
              }
            }

            return {
              duplicateCount: extraJobIds.size,
              duplicateGroups,
              seriesToEnd: [...seriesToEnd],
              extraJobIds: [...extraJobIds],
              examples
            };
          }

          async function loadRows(ctx: Awaited<ReturnType<typeof requireWorkspaceSession>>) {
            if (!ctx.ok) return { rows: [] as JobRow[], error: ctx.error };
            const { data, error } = await ctx.supabase
              .from('jobs')
              .select('id,title,customer_id,customer_name,address,status,scheduled_start,scheduled_end,start_date,due_date,revenue_amount,recurring_series_id,occurrence_date,occurrence_local_time,created_at')
              .eq('organization_id', ctx.workspace.organizationId)
              .not('recurring_series_id', 'is', null);
            return { rows: (data || []) as JobRow[], error: error?.message || null };
          }

          export async function GET() {
            const ctx = await requireWorkspaceSession({ requireManager: true });
            if (!ctx.ok) {
              return NextResponse.json({ error: ctx.error, code: ctx.code }, { status: ctx.status });
            }
            const loaded = await loadRows(ctx);
            if (loaded.error) {
              return NextResponse.json({ error: mapWorkspaceSaveError(loaded.error) }, { status: 400 });
            }
            return NextResponse.json(buildPreview(loaded.rows));
          }

          export async function DELETE() {
            const ctx = await requireWorkspaceSession({ requireManager: true });
            if (!ctx.ok) {
              return NextResponse.json({ error: ctx.error, code: ctx.code }, { status: ctx.status });
            }

            const loaded = await loadRows(ctx);
            if (loaded.error) {
              return NextResponse.json({ error: mapWorkspaceSaveError(loaded.error) }, { status: 400 });
            }
            const preview = buildPreview(loaded.rows);
            if (!preview.duplicateCount) {
              return NextResponse.json({ ok: true, deletedJobCount: 0, endedSeriesCount: 0 });
            }

            const today = new Date().toISOString().slice(0, 10);
            const idsToDelete = new Set(preview.extraJobIds);

            if (preview.seriesToEnd.length) {
              const { error: seriesUpdateError } = await ctx.supabase
                .from('recurring_job_series')
                .update({ status: 'ended', end_date: today, next_generation_date: null, updated_at: new Date().toISOString() })
                .eq('organization_id', ctx.workspace.organizationId)
                .in('id', preview.seriesToEnd);
              if (seriesUpdateError) {
                return NextResponse.json({ error: mapWorkspaceSaveError(seriesUpdateError.message) }, { status: 400 });
              }

              for (const row of loaded.rows) {
                if (!row.recurring_series_id || !preview.seriesToEnd.includes(row.recurring_series_id)) continue;
                const date = jobDate(row);
                if (date >= today && !finishedStatuses.has(normalize(row.status))) idsToDelete.add(row.id);
              }
            }

            const jobIds = [...idsToDelete];
            if (jobIds.length) {
              await ctx.supabase
                .from('record_shares')
                .delete()
                .eq('organization_id', ctx.workspace.organizationId)
                .eq('record_type', 'job')
                .in('record_id', jobIds);

              const { error: deleteError } = await ctx.supabase
                .from('jobs')
                .delete()
                .eq('organization_id', ctx.workspace.organizationId)
                .in('id', jobIds);
              if (deleteError) {
                return NextResponse.json({ error: mapWorkspaceSaveError(deleteError.message) }, { status: 409 });
              }
            }

            await logWorkspaceActivity(
              ctx.workspace.organizationId,
              ctx.userId,
              'job',
              'duplicate-cleanup',
              'job_duplicates_removed',
              `Removed ${jobIds.length} duplicate recurring job${jobIds.length === 1 ? '' : 's'}.`,
              { deletedJobCount: jobIds.length, endedSeriesCount: preview.seriesToEnd.length }
            );

            return NextResponse.json({
              ok: true,
              deletedJobCount: jobIds.length,
              endedSeriesCount: preview.seriesToEnd.length
            });
          }
          TS

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/jobs/page.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
          """newJob: 'New job', all: 'All', today: 'Today', active: 'Active', finished: 'Finished', needsWorker: 'Needs worker', filtered: 'Filtered', showAll: 'Show all', missingFinish: 'Finished jobs missing a finish date.', loading: 'Loading…', unableLoad: 'Unable to load jobs.', removeConfirm: 'Remove job \"{title}\"?', unableRemove: 'Unable to remove job.', noCustomer: 'No customer', photo: 'photo', photos: 'photos', maps: 'Maps', more: 'More', removing: 'Removing…', remove: 'Remove', bookAgain: 'Book again', creating: 'Creating…', date: 'Date', job: 'Job', address: 'Address', assignedTo: 'Assigned to', status: 'Status', actions: 'Actions', openJob: 'Open job', unscheduled: 'Unscheduled', unassigned: 'Needs worker', amount: 'Amount'""",
          """newJob: 'New job', all: 'All', today: 'Today', active: 'Active', finished: 'Finished', needsWorker: 'Needs worker', filtered: 'Filtered', showAll: 'Show all', missingFinish: 'Finished jobs missing a finish date.', loading: 'Loading…', unableLoad: 'Unable to load jobs.', removeConfirm: 'Remove job \"{title}\"?', unableRemove: 'Unable to remove job.', noCustomer: 'No customer', photo: 'photo', photos: 'photos', maps: 'Maps', more: 'More', removing: 'Removing…', remove: 'Remove', bookAgain: 'Book again', creating: 'Creating…', date: 'Date', job: 'Job', address: 'Address', assignedTo: 'Assigned to', status: 'Status', actions: 'Actions', openJob: 'Open job', unscheduled: 'Unscheduled', unassigned: 'Needs worker', amount: 'Amount', findDuplicates: 'Find duplicates', checkingDuplicates: 'Checking…', noDuplicates: 'No future recurring duplicates found.', duplicateConfirm: 'Found {count} duplicate future recurring job(s). Remove only the extra copies and keep the originals?', duplicatesRemoved: 'Duplicate recurring jobs removed.', duplicateCleanupFailed: 'Unable to clean up duplicate jobs.'""")

          replace_once(
          """newJob: 'Nuevo trabajo', all: 'Todos', today: 'Hoy', active: 'Activos', finished: 'Finalizados', needsWorker: 'Necesita trabajador', filtered: 'Filtrado', showAll: 'Mostrar todos', missingFinish: 'Trabajos finalizados sin fecha de finalización.', loading: 'Cargando…', unableLoad: 'No se pudieron cargar los trabajos.', removeConfirm: '¿Eliminar el trabajo \"{title}\"?', unableRemove: 'No se pudo eliminar el trabajo.', noCustomer: 'Sin cliente', photo: 'foto', photos: 'fotos', maps: 'Mapas', more: 'Más', removing: 'Eliminando…', remove: 'Eliminar', bookAgain: 'Reservar de nuevo', creating: 'Creando…', date: 'Fecha', job: 'Trabajo', address: 'Dirección', assignedTo: 'Asignado a', status: 'Estado', actions: 'Acciones', openJob: 'Abrir trabajo', unscheduled: 'Sin programar', unassigned: 'Necesita trabajador', amount: 'Importe'""",
          """newJob: 'Nuevo trabajo', all: 'Todos', today: 'Hoy', active: 'Activos', finished: 'Finalizados', needsWorker: 'Necesita trabajador', filtered: 'Filtrado', showAll: 'Mostrar todos', missingFinish: 'Trabajos finalizados sin fecha de finalización.', loading: 'Cargando…', unableLoad: 'No se pudieron cargar los trabajos.', removeConfirm: '¿Eliminar el trabajo \"{title}\"?', unableRemove: 'No se pudo eliminar el trabajo.', noCustomer: 'Sin cliente', photo: 'foto', photos: 'fotos', maps: 'Mapas', more: 'Más', removing: 'Eliminando…', remove: 'Eliminar', bookAgain: 'Reservar de nuevo', creating: 'Creando…', date: 'Fecha', job: 'Trabajo', address: 'Dirección', assignedTo: 'Asignado a', status: 'Estado', actions: 'Acciones', openJob: 'Abrir trabajo', unscheduled: 'Sin programar', unassigned: 'Necesita trabajador', amount: 'Importe', findDuplicates: 'Buscar duplicados', checkingDuplicates: 'Revisando…', noDuplicates: 'No se encontraron duplicados recurrentes futuros.', duplicateConfirm: 'Se encontraron {count} trabajos recurrentes futuros duplicados. ¿Eliminar solo las copias adicionales y conservar los originales?', duplicatesRemoved: 'Se eliminaron los trabajos recurrentes duplicados.', duplicateCleanupFailed: 'No se pudieron eliminar los trabajos duplicados.'""")

          replace_once(
          """newJob: 'Công việc mới', all: 'Tất cả', today: 'Hôm nay', active: 'Đang hoạt động', finished: 'Đã hoàn thành', needsWorker: 'Cần nhân sự', filtered: 'Đã lọc', showAll: 'Hiển thị tất cả', missingFinish: 'Công việc đã hoàn thành nhưng thiếu ngày hoàn tất.', loading: 'Đang tải…', unableLoad: 'Không thể tải công việc.', removeConfirm: 'Xóa công việc \"{title}\"?', unableRemove: 'Không thể xóa công việc.', noCustomer: 'Không có khách hàng', photo: 'ảnh', photos: 'ảnh', maps: 'Bản đồ', more: 'Thêm', removing: 'Đang xóa…', remove: 'Xóa', bookAgain: 'Đặt lại', creating: 'Đang tạo…', date: 'Ngày', job: 'Công việc', address: 'Địa chỉ', assignedTo: 'Phân công', status: 'Trạng thái', actions: 'Thao tác', openJob: 'Mở công việc', unscheduled: 'Chưa lên lịch', unassigned: 'Cần nhân sự', amount: 'Số tiền'""",
          """newJob: 'Công việc mới', all: 'Tất cả', today: 'Hôm nay', active: 'Đang hoạt động', finished: 'Đã hoàn thành', needsWorker: 'Cần nhân sự', filtered: 'Đã lọc', showAll: 'Hiển thị tất cả', missingFinish: 'Công việc đã hoàn thành nhưng thiếu ngày hoàn tất.', loading: 'Đang tải…', unableLoad: 'Không thể tải công việc.', removeConfirm: 'Xóa công việc \"{title}\"?', unableRemove: 'Không thể xóa công việc.', noCustomer: 'Không có khách hàng', photo: 'ảnh', photos: 'ảnh', maps: 'Bản đồ', more: 'Thêm', removing: 'Đang xóa…', remove: 'Xóa', bookAgain: 'Đặt lại', creating: 'Đang tạo…', date: 'Ngày', job: 'Công việc', address: 'Địa chỉ', assignedTo: 'Phân công', status: 'Trạng thái', actions: 'Thao tác', openJob: 'Mở công việc', unscheduled: 'Chưa lên lịch', unassigned: 'Cần nhân sự', amount: 'Số tiền', findDuplicates: 'Tìm bản trùng', checkingDuplicates: 'Đang kiểm tra…', noDuplicates: 'Không tìm thấy công việc định kỳ tương lai bị trùng.', duplicateConfirm: 'Tìm thấy {count} công việc định kỳ tương lai bị trùng. Chỉ xóa các bản sao và giữ bản gốc?', duplicatesRemoved: 'Đã xóa các công việc định kỳ bị trùng.', duplicateCleanupFailed: 'Không thể xóa các công việc bị trùng.'""")

          replace_once(
          """  const [duplicatingId, setDuplicatingId] = useState('');
            const [openMenuId, setOpenMenuId] = useState('');""",
          """  const [duplicatingId, setDuplicatingId] = useState('');
            const [cleaningDuplicates, setCleaningDuplicates] = useState(false);
            const [openMenuId, setOpenMenuId] = useState('');""")

          replace_once(
          """  async function bookAgain(job: Job) {""",
          """  async function cleanupDuplicates() {
            setCleaningDuplicates(true);
            try {
              const previewRes = await fetch('/api/jobs/deduplicate', { cache: 'no-store' });
              const preview = (await previewRes.json().catch(() => ({}))) as { duplicateCount?: number; error?: string };
              if (!previewRes.ok) {
                appFeedback.error(preview.error || c.duplicateCleanupFailed);
                return;
              }
              const count = Number(preview.duplicateCount || 0);
              if (!count) {
                appFeedback.success(c.noDuplicates);
                return;
              }
              if (!window.confirm(c.duplicateConfirm.replace('{count}', String(count)))) return;

              const cleanupRes = await fetch('/api/jobs/deduplicate', { method: 'DELETE' });
              const cleanup = (await cleanupRes.json().catch(() => ({}))) as { deletedJobCount?: number; error?: string };
              if (!cleanupRes.ok) {
                appFeedback.error(cleanup.error || c.duplicateCleanupFailed);
                return;
              }
              appFeedback.success(`${c.duplicatesRemoved} ${Number(cleanup.deletedJobCount || 0)}`);
              await load();
            } finally {
              setCleaningDuplicates(false);
            }
          }

            async function bookAgain(job: Job) {""")

          replace_once(
          """<PageHeader title={t('nav.jobs')} action={<div className=\"jobs-header-actions\">{canExport ? <ExportMenu endpoint=\"/api/exports/jobs\" query={exportQuery} locale={locale} disabled={loading} onError={(message) => appFeedback.error(message || exportCopy.exportFailed)} /> : null}<Link className=\"btn btn-primary\" href=\"/jobs/new\">{c.newJob}</Link></div>} />""",
          """<PageHeader title={t('nav.jobs')} action={<div className=\"jobs-header-actions\">{managerView ? <button type=\"button\" className=\"btn btn-secondary\" disabled={loading || cleaningDuplicates} onClick={() => void cleanupDuplicates()}>{cleaningDuplicates ? c.checkingDuplicates : c.findDuplicates}</button> : null}{canExport ? <ExportMenu endpoint=\"/api/exports/jobs\" query={exportQuery} locale={locale} disabled={loading} onError={(message) => appFeedback.error(message || exportCopy.exportFailed)} /> : null}<Link className=\"btn btn-primary\" href=\"/jobs/new\">{c.newJob}</Link></div>} />""")

          path.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate
        run: |
          npm ci
          npm run typecheck

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "EverittOS Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/add-job-duplicate-cleanup.yml
          git add app/jobs/page.tsx app/api/jobs/deduplicate/route.ts
          git commit -m "Add safe recurring duplicate cleanup"
          git push origin main
