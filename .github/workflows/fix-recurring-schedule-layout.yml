name: Fix recurring schedule layout

on:
  push:
    paths:
      - scripts/fix-recurring-schedule-layout.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused Job Creator patch
        run: node scripts/fix-recurring-schedule-layout.mjs
      - name: Commit patched component
        run: |
          if git diff --quiet -- components/job-creator.tsx; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/job-creator.tsx
          git commit -m "Group recurring date time and timezone controls"
          git push
