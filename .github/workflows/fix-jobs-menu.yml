name: Fix Jobs action menu

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-jobs-menu.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Jobs action menu
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'components/jobs-list.tsx';
          let source = fs.readFileSync(file, 'utf8');

          if (!source.includes("import { createPortal } from 'react-dom';")) {
            source = source.replace(
              "import { useCallback, useEffect, useMemo, useRef, useState } from 'react';",
              "import { useCallback, useEffect, useMemo, useRef, useState, type ReactNode } from 'react';\nimport { createPortal } from 'react-dom';"
            );
          }

          source = source.replace("  const [openMenuId, setOpenMenuId] = useState('');\n", '');

          if (!source.includes('function PortalActionMenu(')) {
            const marker = 'export function JobsList() {';
            if (!source.includes(marker)) throw new Error('JobsList marker not found');
            const component = `function PortalActionMenu({ label, children }: { label: string; children: ReactNode }) {\n  const [open, setOpen] = useState(false);\n  const [position, setPosition] = useState<{ top: number; left: number; width: number } | null>(null);\n  const triggerRef = useRef<HTMLButtonElement | null>(null);\n  const panelRef = useRef<HTMLDivElement | null>(null);\n\n  const close = useCallback(() => {\n    setOpen(false);\n    setPosition(null);\n  }, []);\n\n  useEffect(() => {\n    if (!open) return;\n    const onPointerDown = (event: PointerEvent) => {\n      const target = event.target as Node | null;\n      if (!target) return;\n      if (triggerRef.current?.contains(target) || panelRef.current?.contains(target)) return;\n      close();\n    };\n    const onKeyDown = (event: KeyboardEvent) => {\n      if (event.key === 'Escape') close();\n    };\n    document.addEventListener('pointerdown', onPointerDown);\n    document.addEventListener('keydown', onKeyDown);\n    window.addEventListener('resize', close);\n    window.addEventListener('scroll', close, true);\n    return () => {\n      document.removeEventListener('pointerdown', onPointerDown);\n      document.removeEventListener('keydown', onKeyDown);\n      window.removeEventListener('resize', close);\n      window.removeEventListener('scroll', close, true);\n    };\n  }, [close, open]);\n\n  function toggle() {\n    if (open) {\n      close();\n      return;\n    }\n    const rect = triggerRef.current?.getBoundingClientRect();\n    if (!rect) return;\n    const width = Math.min(220, Math.max(160, window.innerWidth - 24));\n    const estimatedHeight = 240;\n    const left = Math.min(window.innerWidth - width - 12, Math.max(12, rect.right - width));\n    const spaceBelow = window.innerHeight - rect.bottom;\n    const top = spaceBelow >= estimatedHeight + 12\n      ? rect.bottom + 8\n      : Math.max(12, rect.top - estimatedHeight - 8);\n    setPosition({ top, left, width });\n    setOpen(true);\n  }\n\n  return (\n    <>\n      <button ref={triggerRef} type=\"button\" className=\"jobs-menu-trigger\" aria-label={label} aria-haspopup=\"menu\" aria-expanded={open} onClick={(event) => { event.stopPropagation(); toggle(); }}>•••</button>\n      {open && position && typeof document !== 'undefined' ? createPortal(\n        <div\n          ref={panelRef}\n          className=\"jobs-more-panel jobs-more-panel-portal\"\n          role=\"menu\"\n          style={{ position: 'fixed', top: position.top, left: position.left, width: position.width, zIndex: 10000, display: 'grid', gap: 2, padding: 6, border: '1px solid rgba(37, 54, 74, 0.14)', borderRadius: 10, background: '#fff', color: '#25364A', boxShadow: '0 16px 40px rgba(19, 36, 51, 0.18)' }}\n          onClick={(event) => { event.stopPropagation(); setOpen(false); }}\n        >\n          {children}\n          <style jsx global>{\`\n            .jobs-more-panel-portal .jobs-menu-item { display: flex; width: 100%; min-height: 40px; align-items: center; padding: 9px 11px; border: 0; border-radius: 7px; background: transparent; color: #25364A; font: inherit; text-align: left; text-decoration: none; cursor: pointer; }\n            .jobs-more-panel-portal .jobs-menu-item:hover, .jobs-more-panel-portal .jobs-menu-item:focus-visible { background: rgba(47, 95, 143, 0.08); outline: none; }\n            .jobs-more-panel-portal .jobs-menu-item:disabled { opacity: .55; cursor: not-allowed; }\n            .jobs-more-panel-portal .jobs-menu-danger { color: #8f2d2d; }\n          \`}</style>\n        </div>,\n        document.body\n      ) : null}\n    </>\n  );\n}\n\n`;
            source = source.replace(marker, component + marker);
          }

          const lines = source.split('\n');
          const actionLineIndex = lines.findIndex((line) => line.includes('className="jobs-col-actions"') && line.includes('jobs-more-menu'));
          if (actionLineIndex === -1) throw new Error('Jobs action menu line not found');
          const indent = lines[actionLineIndex].match(/^\s*/)?.[0] || '';
          lines[actionLineIndex] = `${indent}<td data-label={c.actions} className="jobs-col-actions" onClick={(event) => event.stopPropagation()}><PortalActionMenu label={c.more}><Link href={jobDetailHref(role, job.id)} target="_blank" rel="noopener noreferrer" className="jobs-menu-item" role="menuitem" onClick={(event) => event.stopPropagation()}>{c.openJob}</Link>{job.address ? <a href={\`https://maps.google.com/?q=\${encodeURIComponent(job.address)}\`} className="jobs-menu-item" role="menuitem" target="_blank" rel="noreferrer" onClick={(event) => event.stopPropagation()}>{c.maps}</a> : null}{managerView ? <button type="button" className="jobs-menu-item" role="menuitem" disabled={duplicatingId === job.id} onClick={(event) => { event.stopPropagation(); void bookAgain(job); }}>{duplicatingId === job.id ? c.creating : c.bookAgain}</button> : null}{showInvoice ? <Link href={invoiceHref(job)} className="jobs-menu-item" role="menuitem" onClick={(event) => event.stopPropagation()}>{billingCopy.createInvoice}</Link> : null}{managerView ? <button type="button" className="jobs-menu-item jobs-menu-danger" role="menuitem" disabled={removingId === job.id} onClick={(event) => { event.stopPropagation(); void removeJob(job); }}>{removingId === job.id ? c.removing : c.remove}</button> : null}</PortalActionMenu></td>`;
          source = lines.join('\n');

          if (source.includes('openMenuId') || source.includes('setOpenMenuId')) throw new Error('Old menu state still present');
          fs.writeFileSync(file, source);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify types
        run: npm run typecheck

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/jobs-list.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Render Jobs action menu above clipped cards"
          git push origin main
