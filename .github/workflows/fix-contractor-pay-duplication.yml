name: Fix contractor pay duplication

on:
  push:
    paths:
      - '.github/workflows/fix-contractor-pay-duplication.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove duplicate contractor pay input
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'components/job-creator.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const replacements = [
            ["  const [contractorName, setContractorName] = useState('');\n", ""],
            [
              "    const hasContractorPay = contractorName.trim() || contractorHours || contractorHourlyRate || contractorFlatRate;\n    if (hasContractorPay && !contractorName.trim()) {\n      appFeedback.error('Add the contractor or cleaner name.');\n      return;\n    }\n",
              "    const hasContractorPay = Boolean(contractorHours || contractorHourlyRate || contractorFlatRate);\n"
            ],
            ["          contractor_name: contractorName.trim() || assignedMember?.label || null,", "          contractor_name: assignedMember?.label || null,"],
            ["            worker_name: contractorName.trim() || assignedMember?.label || null,", "            worker_name: assignedMember?.label || null,"],
            [
              "          <label style={{ marginTop: 12 }}>Contractor pay / expected labor expense</label>\n          <input className=\"input\" value={contractorName} onChange={(e) => setContractorName(e.target.value)} placeholder=\"Contractor or cleaner name (optional)\" />\n          <div className=\"segmented-control\" role=\"group\" aria-label=\"Contractor pay type\" style={{ marginTop: 8 }}>",
              "          <label style={{ marginTop: 12 }}>Payment method</label>\n          <div className=\"segmented-control\" role=\"group\" aria-label=\"Contractor pay type\" style={{ marginTop: 8 }}>"
            ]
          ];

          for (const [before, after] of replacements) {
            if (!source.includes(before)) {
              throw new Error(`Expected source block not found: ${before.slice(0, 100)}`);
            }
            source = source.replace(before, after);
          }

          if (source.includes('contractorName') || source.includes('Contractor pay / expected labor expense')) {
            throw new Error('Duplicate contractor pay implementation remains');
          }

          fs.writeFileSync(path, source);
          NODE

      - name: Validate finance tests
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test -- tests/recurring-job-finance.test.ts
          npm run build

      - name: Commit directly to main
        run: |
          git config user.name 'EverittOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/job-creator.tsx
          git commit -m 'fix: simplify contractor pay fields'
          git push origin main
