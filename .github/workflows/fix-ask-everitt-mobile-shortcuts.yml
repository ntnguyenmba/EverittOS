name: Fix Ask Everitt mobile shortcuts

on:
  push:
    paths:
      - .github/workflows/fix-ask-everitt-mobile-shortcuts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update mobile and desktop shortcut behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/ask-everitt-command.tsx')
          text = path.read_text()

          replacements = {
              "footerPrefix: 'Search uses your workspace data · AI only when needed · Esc to close ·',": "footerPrefix: 'Search uses your workspace data · AI only when needed ·',",
              "footerPrefix: 'La búsqueda usa los datos de su espacio · IA solo cuando se necesita · Esc para cerrar ·',": "footerPrefix: 'La búsqueda usa los datos de su espacio · IA solo cuando se necesita ·',",
              "footerPrefix: 'Tìm kiếm dùng dữ liệu không gian của bạn · Chỉ dùng AI khi cần · Esc để đóng ·',": "footerPrefix: 'Tìm kiếm dùng dữ liệu không gian của bạn · Chỉ dùng AI khi cần ·',",
              "  useEffect(() => {\n    setKbd(navigator.platform.toLowerCase().includes('mac') ? '⌘K' : 'Ctrl+K');\n  }, []);": "  useEffect(() => {\n    const touchOnly = window.matchMedia('(hover: none), (pointer: coarse)').matches;\n    if (touchOnly) {\n      setKbd('');\n      return;\n    }\n\n    const platform = navigator.userAgentData?.platform || navigator.platform || '';\n    setKbd(platform.toLowerCase().includes('mac') ? '⌘K' : 'Ctrl+K');\n  }, []);",
              "            {copy.inlineTrigger} <span className=\"muted\">{kbd}</span>": "            {copy.inlineTrigger} {kbd ? <span className=\"muted\">{kbd}</span> : null}",
              "        <span className=\"everitt-cmd-kbd\">{kbd}</span>": "        {kbd ? <span className=\"everitt-cmd-kbd\">{kbd}</span> : null}",
              "          <span className=\"everitt-cmd-kbd everitt-cmd-kbd-muted\">{kbd}</span>": "          {kbd ? <span className=\"everitt-cmd-kbd everitt-cmd-kbd-muted\">{kbd}</span> : null}",
              "      <div className=\"everitt-cmd-palette\" role=\"dialog\" aria-label={copy.title} onClick={(e) => e.stopPropagation()}>\n        <div className=\"everitt-cmd-bar\">": "      <div className=\"everitt-cmd-palette\" role=\"dialog\" aria-label={copy.title} onClick={(e) => e.stopPropagation()}>\n        <button type=\"button\" className=\"everitt-cmd-close\" onClick={onClose} aria-label={copy.cancel}>\n          ×\n        </button>\n        <div className=\"everitt-cmd-bar\">"
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          css = Path('app/globals.css')
          css_text = css.read_text()
          marker = '/* Ask Everitt mobile close control */'
          if marker not in css_text:
              css_text += """

/* Ask Everitt mobile close control */
.everitt-cmd-palette {
  position: relative;
}

.everitt-cmd-close {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 2;
  display: none;
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
}

@media (hover: none), (pointer: coarse), (max-width: 767px) {
  .everitt-cmd-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .everitt-cmd-bar {
    padding-right: 48px;
  }
}
"""
              css.write_text(css_text)
          PY

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ask-everitt-mobile-shortcuts.yml
          git add components/ask-everitt-command.tsx app/globals.css
          git commit -m "Make Ask Everitt controls mobile friendly"
          git push origin main
