name: Apply Next.js security update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-next-security-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install patched framework versions
        run: npm install --save-exact next@15.5.24 react@19.1.2 react-dom@19.1.2

      - name: Remove temporary updater
        run: rm .github/workflows/apply-next-security-update.yml

      - name: Commit security update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/apply-next-security-update.yml
          git commit -m "fix: update Next.js and React security patches"
          git push origin HEAD:main
