name: Repair jobs email and financial metrics

on:
  push:
    paths:
      - .github/workflows/fix-tablet-header-spacing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Tablet header gutters
          replace_once(
              'components/app-shell.tsx',
              "padding: 8px 24px !important;",
              "padding: 8px clamp(32px, 4vw, 64px) !important;"
          )
          replace_once(
              'components/app-shell.tsx',
              "padding: 12px 24px 28px !important;",
              "padding: 12px clamp(32px, 4vw, 64px) 28px !important;"
          )

          # Add customer email to job creation
          replace_once(
              'components/job-creator.tsx',
              "const [phone, setPhone] = useState('');",
              "const [phone, setPhone] = useState('');\n  const [customerEmail, setCustomerEmail] = useState('');"
          )
          replace_once(
              'components/job-creator.tsx',
              "phone: phone.trim() || null,\n        address:",
              "phone: phone.trim() || null,\n        customer_email: customerEmail.trim() || null,\n        address:"
          )
          replace_once(
              'components/job-creator.tsx',
              "<div className=\"grid-2\">\n            <div className=\"form-group\"><label>Customer name</label><input className=\"input\" value={customerName} onChange={(e) => setCustomerName(e.target.value)} /></div>\n            <div className=\"form-group\"><label>Phone</label><input className=\"input\" value={phone} onChange={(e) => setPhone(e.target.value)} /></div>\n          </div>",
              "<div className=\"grid-2\">\n            <div className=\"form-group\"><label>Customer name</label><input className=\"input\" value={customerName} onChange={(e) => setCustomerName(e.target.value)} /></div>\n            <div className=\"form-group\"><label>Phone</label><input className=\"input\" value={phone} onChange={(e) => setPhone(e.target.value)} /></div>\n            <div className=\"form-group\"><label>Email</label><input className=\"input\" type=\"email\" value={customerEmail} onChange={(e) => setCustomerEmail(e.target.value)} /></div>\n          </div>"
          )

          # Jobs create API
          replace_once(
              'app/api/jobs/route.ts',
              "phone?: string;\n    address?: string;",
              "phone?: string;\n    customer_email?: string;\n    address?: string;"
          )
          replace_once(
              'app/api/jobs/route.ts',
              "phone: body.phone?.trim() || null,\n      address:",
              "phone: body.phone?.trim() || null,\n      customer_email: body.customer_email?.trim() || null,\n      address:"
          )

          # Jobs update API
          replace_once(
              'app/api/jobs/[id]/route.ts',
              "'phone',\n  'address',",
              "'phone',\n  'customer_email',\n  'address',"
          )
          replace_once(
              'app/api/jobs/[id]/route.ts',
              "'phone',\n  'address',\n  'notes',\n  'start_date',",
              "'phone',\n  'customer_email',\n  'address',\n  'notes',\n  'start_date',"
          )

          # Job detail type, query, save, and UI
          replace_once(
              'app/jobs/[id]/page.tsx',
              "phone: string | null;\n  address:",
              "phone: string | null;\n  customer_email: string | null;\n  address:"
          )
          replace_once(
              'app/jobs/[id]/page.tsx',
              "'phone',\n  'address',",
              "'phone',\n  'customer_email',\n  'address',"
          )
          replace_once(
              'app/jobs/[id]/page.tsx',
              "phone: job.phone,\n        address:",
              "phone: job.phone,\n        customer_email: job.customer_email,\n        address:"
          )
          replace_once(
              'app/jobs/[id]/page.tsx',
              "<label>{copy.phone}</label>\n                <input className=\"input\" value={job.phone || ''} onChange={(e) => setJob({ ...job, phone: e.target.value })} />\n                <label>{copy.address}</label>",
              "<label>{copy.phone}</label>\n                <input className=\"input\" value={job.phone || ''} onChange={(e) => setJob({ ...job, phone: e.target.value })} />\n                <label>Email</label>\n                <input className=\"input\" type=\"email\" value={job.customer_email || ''} onChange={(e) => setJob({ ...job, customer_email: e.target.value })} />\n                <label>{copy.address}</label>"
          )
          replace_once(
              'app/jobs/[id]/page.tsx',
              "<p><strong>{copy.phone}:</strong> {displayValue(job.phone, copy.notSet)}</p>\n                <p><strong>{copy.address}:</strong>",
              "<p><strong>{copy.phone}:</strong> {displayValue(job.phone, copy.notSet)}</p>\n                <p><strong>Email:</strong> {displayValue(job.customer_email, copy.notSet)}</p>\n                <p><strong>{copy.address}:</strong>"
          )

          # Outstanding calculation: ledger only wins when that invoice has ledger rows.
          metrics = Path('lib/dashboard-metrics.ts')
          text = metrics.read_text()
          text = text.replace("  const useLedger = Array.isArray(input.invoicePayments);\n", "", 1)
          old = """    const paidRaw = useLedger
      ? paidByInvoice.get(invoiceId) || 0
      : num(inv.amount_paid);
"""
          new = """    const explicitlyPaid = statusTokens(inv).includes('paid');
    const hasLedgerPayments = paidByInvoice.has(invoiceId);
    const paidRaw = explicitlyPaid
      ? num(inv.amount)
      : hasLedgerPayments
        ? paidByInvoice.get(invoiceId) || 0
        : num(inv.amount_paid);
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected invoice outstanding block not found')
              text = text.replace(old, new, 1)

          old_job = """    const status = String(job.status || '').toLowerCase();
    if (status === 'cancelled' || status === 'canceled') continue;
"""
          new_job = """    const status = String(job.status || '').toLowerCase();
    if (status === 'cancelled' || status === 'canceled' || status === 'paid') continue;
"""
          if new_job not in text:
              if old_job not in text:
                  raise SystemExit('Expected direct job status block not found')
              text = text.replace(old_job, new_job, 1)
          metrics.write_text(text)

          # Database migration for customer email
          migration = Path('supabase/migrations/202607260100_add_jobs_customer_email.sql')
          migration.write_text("""alter table public.jobs
add column if not exists customer_email text;

comment on column public.jobs.customer_email is
'Customer contact email stored with the job.';
""")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-tablet-header-spacing.yml

      - name: Commit repairs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/app-shell.tsx components/job-creator.tsx app/api/jobs/route.ts app/api/jobs/'[id]'/route.ts app/jobs/'[id]'/page.tsx lib/dashboard-metrics.ts supabase/migrations/202607260100_add_jobs_customer_email.sql .github/workflows/fix-tablet-header-spacing.yml
          git commit -m "Fix job email capture and paid balance metrics"
          git push origin main
