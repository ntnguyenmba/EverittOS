name: Apply billing retry fix

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-billing-retry-fix.mjs
      - .github/workflows/apply-billing-retry-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-billing-retry-fix.mjs
      - run: npm run typecheck
      - run: npx vitest run tests/billing-release-safety.test.ts tests/stripe-billing-sync.test.ts tests/stripe-enterprise-checkout.test.ts
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/stripe-billing-sync.ts tests/billing-release-safety.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make Stripe billing retries reliable"
            git push origin main
          fi
