<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#24302B" />
    <title>EverittOS — Offline</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top));
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: #f7f6f3;
        color: #24302b;
      }

      main {
        width: min(480px, 100%);
        text-align: center;
      }

      p {
        color: #5f6f66;
        line-height: 1.5;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        background: #2f5f8f;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connection required</h1>
      <p>EverittOS needs an internet connection to load your workspace. Unsaved changes on other pages are not shown here.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
